secrets:
  postgres_admin_password:
    file: ${LOCAL_SECRET_DIR:-.runtime/secrets}/postgres_admin_password
  postgres_api_password:
    file: ${LOCAL_SECRET_DIR:-.runtime/secrets}/postgres_api_password
  postgres_processor_password:
    file: ${LOCAL_SECRET_DIR:-.runtime/secrets}/postgres_processor_password
  postgres_migration_password:
    file: ${LOCAL_SECRET_DIR:-.runtime/secrets}/postgres_migration_password
  postgres_backup_password:
    file: ${LOCAL_SECRET_DIR:-.runtime/secrets}/postgres_backup_password
  postgres_monitor_password:
    file: ${LOCAL_SECRET_DIR:-.runtime/secrets}/postgres_monitor_password
  clickhouse_admin_password:
    file: ${LOCAL_SECRET_DIR:-.runtime/secrets}/clickhouse_admin_password
  clickhouse_api_password:
    file: ${LOCAL_SECRET_DIR:-.runtime/secrets}/clickhouse_api_password
  clickhouse_processor_password:
    file: ${LOCAL_SECRET_DIR:-.runtime/secrets}/clickhouse_processor_password
  clickhouse_migration_password:
    file: ${LOCAL_SECRET_DIR:-.runtime/secrets}/clickhouse_migration_password
  clickhouse_backup_password:
    file: ${LOCAL_SECRET_DIR:-.runtime/secrets}/clickhouse_backup_password
  clickhouse_monitor_password:
    file: ${LOCAL_SECRET_DIR:-.runtime/secrets}/clickhouse_monitor_password

x-postgres-api: &postgres-api
  POSTGRES_USER: ${POSTGRES_API_USER:-banking_api}
  POSTGRES_PASSWORD: ""
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_api_password

x-postgres-processor: &postgres-processor
  POSTGRES_USER: ${POSTGRES_PROCESSOR_USER:-banking_processor}
  POSTGRES_PASSWORD: ""
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_processor_password

x-clickhouse-api: &clickhouse-api
  CLICKHOUSE_USER: ${CLICKHOUSE_API_USER:-banking_ch_api}
  CLICKHOUSE_PASSWORD: ""
  CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_api_password

x-clickhouse-processor: &clickhouse-processor
  CLICKHOUSE_USER: ${CLICKHOUSE_PROCESSOR_USER:-banking_ch_processor}
  CLICKHOUSE_PASSWORD: ""
  CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_processor_password

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER:-banking_backup}
      POSTGRES_BACKUP_PASSWORD_FILE: /run/secrets/postgres_backup_password
    secrets:
      - postgres_admin_password
      - postgres_backup_password

  postgres_identity_init:
    image: postgres@sha256:7e2070cf6ad06fb3cbbd141b1bafbb7fd5bb63e2b6001e6daf34448eb555e4b3
    environment:
      POSTGRES_ADMIN_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_API_USER: ${POSTGRES_API_USER:-banking_api}
      POSTGRES_PROCESSOR_USER: ${POSTGRES_PROCESSOR_USER:-banking_processor}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-banking_migration}
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER:-banking_backup}
      POSTGRES_MONITOR_USER: ${POSTGRES_MONITOR_USER:-banking_monitor}
    command: ["bash", "/security/bootstrap-postgres-identities.sh"]
    volumes:
      - ./docker/security/bootstrap-postgres-identities.sh:/security/bootstrap-postgres-identities.sh:ro
    secrets:
      - postgres_admin_password
      - postgres_api_password
      - postgres_processor_password
      - postgres_migration_password
      - postgres_backup_password
      - postgres_monitor_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data_network

  postgres_migrate:
    build:
      context: .
      dockerfile: dashboard/backend/Dockerfile
    command: ["python", "migrate.py"]
    environment:
      POSTGRES_HOST: banking_postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:-banking_migration}
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_migration_password
    secrets:
      - postgres_migration_password
    depends_on:
      postgres_identity_init:
        condition: service_completed_successfully
    networks:
      - data_network

  clickhouse:
    environment:
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_admin_password
    secrets:
      - clickhouse_admin_password

  clickhouse_identity_init:
    image: clickhouse/clickhouse-server@sha256:5d6b622bbb109f40d12333187e44ae80864cf72aa71ae9a4704a53496615e941
    entrypoint: ["bash", "/security/bootstrap-clickhouse-identities.sh"]
    environment:
      CLICKHOUSE_ADMIN_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_API_USER: ${CLICKHOUSE_API_USER:-banking_ch_api}
      CLICKHOUSE_PROCESSOR_USER: ${CLICKHOUSE_PROCESSOR_USER:-banking_ch_processor}
      CLICKHOUSE_MIGRATION_USER: ${CLICKHOUSE_MIGRATION_USER:-banking_ch_migration}
      CLICKHOUSE_BACKUP_USER: ${CLICKHOUSE_BACKUP_USER:-banking_ch_backup}
      CLICKHOUSE_MONITOR_USER: ${CLICKHOUSE_MONITOR_USER:-banking_ch_monitor}
    volumes:
      - ./docker/security/bootstrap-clickhouse-identities.sh:/security/bootstrap-clickhouse-identities.sh:ro
    secrets:
      - clickhouse_admin_password
      - clickhouse_api_password
      - clickhouse_processor_password
      - clickhouse_migration_password
      - clickhouse_backup_password
      - clickhouse_monitor_password
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - data_network

  clickhouse_migrate:
    image: clickhouse/clickhouse-server@sha256:5d6b622bbb109f40d12333187e44ae80864cf72aa71ae9a4704a53496615e941
    entrypoint: ["bash", "/security/migrate-clickhouse.sh"]
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_MIGRATION_USER: ${CLICKHOUSE_MIGRATION_USER:-banking_ch_migration}
    volumes:
      - ./docker/security/migrate-clickhouse.sh:/security/migrate-clickhouse.sh:ro
      - ./docker/clickhouse/init.sql:/migrations/init.sql:ro
    secrets:
      - clickhouse_migration_password
    depends_on:
      clickhouse_identity_init:
        condition: service_completed_successfully
    networks:
      - data_network

  dashboard_backend:
    environment:
      <<: [*postgres-api, *clickhouse-api]
      RUN_DB_MIGRATIONS: "false"
    secrets:
      - postgres_api_password
      - clickhouse_api_password
    depends_on:
      postgres_migrate:
        condition: service_completed_successfully
      clickhouse_migrate:
        condition: service_completed_successfully

  dataset_replay:
    environment: *postgres-processor
    secrets: [postgres_processor_password]
    depends_on:
      postgres_migrate:
        condition: service_completed_successfully

  reconciliation:
    environment:
      <<: [*postgres-processor, *clickhouse-processor]
    secrets: [postgres_processor_password, clickhouse_processor_password]
    depends_on:
      postgres_migrate:
        condition: service_completed_successfully

  graph_processor:
    environment: *postgres-processor
    secrets: [postgres_processor_password]
    depends_on:
      postgres_migrate:
        condition: service_completed_successfully

  benchmark_processor:
    environment: *postgres-processor
    secrets: [postgres_processor_password]
    depends_on:
      postgres_migrate:
        condition: service_completed_successfully

  benchmark_graph_processor:
    environment: *postgres-processor
    secrets: [postgres_processor_password]
    depends_on:
      postgres_migrate:
        condition: service_completed_successfully

  payment_processor:
    environment:
      <<: [*postgres-processor, *clickhouse-processor]
      RUN_CLICKHOUSE_MIGRATIONS: "false"
    secrets: [postgres_processor_password, clickhouse_processor_password]
    depends_on:
      postgres_migrate:
        condition: service_completed_successfully

  fraud_engine:
    environment: *postgres-processor
    secrets: [postgres_processor_password]
    depends_on:
      postgres_migrate:
        condition: service_completed_successfully

  airflow:
    environment:
      <<: [*postgres-processor, *clickhouse-processor]
      PYTHONPATH: /opt/airflow
    secrets: [postgres_processor_password, clickhouse_processor_password]
    volumes:
      - ./shared:/opt/airflow/shared:ro
    depends_on:
      postgres_migrate:
        condition: service_completed_successfully
