services:
  postgres:
    image: postgres:15
    container_name: banking_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount thư mục DDL để tự động chạy các script SQL khởi tạo khi container khởi động lần đầu
      - ./warehouse/ddl:/docker-entrypoint-initdb.d
      - ./dashboard/backend/sql/app_schema.sql:/docker-entrypoint-initdb.d/03_app_schema.sql:ro
    command: postgres -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data_network

  kafka:
    image: bitnamilegacy/kafka:latest
    container_name: banking_kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093
      - KAFKA_KRAFT_CLUSTER_ID=banking_kafka_cluster_id
      - KAFKA_CFG_NODE_ID=1
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_NUM_PARTITIONS=3
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - data_network
      - backend_network

  debezium:
    image: quay.io/debezium/connect:2.4
    container_name: banking_debezium
    ports:
      - "8083:8083"
    environment:
      - BOOTSTRAP_SERVERS=banking_kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=debezium_configs
      - OFFSET_STORAGE_TOPIC=debezium_offsets
      - STATUS_STORAGE_TOPIC=debezium_statuses
    depends_on:
      - kafka
      - postgres
    networks:
      - data_network

  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: banking_spark_master
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - .:/home/hquan07/Desktop/banking_data_platform
    networks:
      - backend_network
      - data_network

  spark-worker:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: banking_spark_worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
    volumes:
      - .:/home/hquan07/Desktop/banking_data_platform
    networks:
      - backend_network
      - data_network

  minio:
    image: quay.io/minio/minio:latest
    container_name: banking_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - minio_data:/data
    networks:
      - data_network
      - backend_network

  minio_init:
    image: quay.io/minio/mc:latest
    container_name: banking_minio_init
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        until mc alias set local http://banking_minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done;
        mc mb --ignore-existing local/banking-lake;
        mc mb --ignore-existing local/evidence;
        mc mb --ignore-existing local/checkpoints;
        echo "MinIO buckets are ready."
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend_network
      - data_network

  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: banking_airflow
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _AIRFLOW_DB_UPGRADE=True
      - _AIRFLOW_WWW_USER_CREATE=True
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_ADMIN_USER}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_ADMIN_PASSWORD}
      - POSTGRES_HOST=banking_postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MINIO_ENDPOINT=http://banking_minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - CLICKHOUSE_HOST=banking_clickhouse
      - CLICKHOUSE_HTTP_PORT=8123
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - ENABLE_MOCK_DATA=false
      - DQ_DATA_PATH=s3://banking-lake/silver/customers/
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_REGION=us-east-1
    ports:
      - "8081:8080"
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./batch:/opt/airflow/batch
      - ./data_quality:/opt/airflow/data_quality
    networks:
      - backend_network
      - data_network

  prometheus:
    image: prom/prometheus:latest
    container_name: banking_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
    networks:
      - backend_network
      - data_network

  grafana:
    image: grafana/grafana:latest
    container_name: banking_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - frontend_network
      - backend_network

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: banking_kafka_exporter
    command: ["--kafka.server=banking_kafka:9092"]
    ports:
      - "9308:9308"
    depends_on:
      - kafka
    networks:
      - backend_network
      - data_network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: banking_clickhouse
    ports:
      - "8123:8123"
      - "9002:9000"
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - data_network

  redis:
    image: redis:latest
    container_name: banking_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data_network

  neo4j:
    image: neo4j:5.11
    container_name: banking_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - data_network

  superset:
    image: apache/superset:latest
    container_name: banking_superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
      - SUPERSET_ADMIN_USER=${SUPERSET_ADMIN_USER}
      - SUPERSET_ADMIN_PASSWORD=${SUPERSET_ADMIN_PASSWORD}
    user: "root"
    command: >
      /bin/sh -c "
      pip install clickhouse-sqlalchemy psycopg2-binary &&
      superset db upgrade &&
      superset fab create-admin --username $${SUPERSET_ADMIN_USER} --firstname Admin --lastname User --email admin@superset.com --password $${SUPERSET_ADMIN_PASSWORD} &&
      superset init &&
      /usr/bin/run-server.sh
      "
    networks:
      - frontend_network
      - backend_network
      - data_network

  dashboard_backend:
    build: 
      context: ./dashboard/backend
      dockerfile: Dockerfile
    container_name: banking_dashboard_backend
    ports:
      - "8000:8000"
    environment:
      - APP_MODE=${APP_MODE:-integration}
      - ENABLE_MOCK_DATA=${ENABLE_MOCK_DATA:-false}
      - POSTGRES_HOST=banking_postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DASHBOARD_ADMIN_PASSWORD=${DASHBOARD_ADMIN_PASSWORD}
      - DASHBOARD_ANALYST_PASSWORD=${DASHBOARD_ANALYST_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVER=banking_kafka:9092
      - REDIS_HOST=banking_redis
      - REDIS_PORT=6379
      - SPARK_CHECKPOINT_DIR=/workspace/.runtime/checkpoints/fraud_engine
      - NEO4J_URI=neo4j://banking_neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - CLICKHOUSE_HOST=banking_clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - MINIO_ENDPOINT=http://banking_minio:9000
      - MINIO_PUBLIC_ENDPOINT=http://localhost:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - backend_network
      - data_network

  payment_processor:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    deploy:
      replicas: 2
    command:
      - /opt/bitnami/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.postgresql:postgresql:42.7.3
      - /workspace/streaming/payment_processing.py
    environment:
      - SPARK_MODE=client
      - KAFKA_BOOTSTRAP_SERVERS=banking_kafka:9092
      - POSTGRES_HOST=banking_postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SPARK_CHECKPOINT_DIR=/workspace/.runtime/checkpoints/payment_processor
    volumes:
      - .:/workspace
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - backend_network
      - data_network

  dashboard_frontend:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
    container_name: banking_dashboard_frontend
    ports:
      - "5173:5173"
    depends_on:
      - dashboard_backend
    networks:
      - frontend_network
      - backend_network

  payment_producer:
    build:
      context: .
      dockerfile: docker/ingestion/Dockerfile
    container_name: banking_payment_producer
    command: ["python", "kafka/producers/payment_producer.py"]
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=banking_kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend_network

  fraud_engine:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: banking_fraud_engine
    command:
      - /opt/bitnami/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.postgresql:postgresql:42.7.3
      - /workspace/streaming/fraud_detection.py
    environment:
      - SPARK_MODE=client
      - KAFKA_BOOTSTRAP_SERVERS=banking_kafka:9092
      - POSTGRES_HOST=banking_postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=banking_redis
      - REDIS_PORT=6379
    volumes:
      - .:/workspace:ro
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_network
      - data_network

volumes:
  postgres_data:
  minio_data:
  clickhouse_data:
  neo4j_data:
  redis_data:

networks:
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge
  data_network:
    driver: bridge
