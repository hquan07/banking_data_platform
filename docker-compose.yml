version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: banking_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banking_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banking_password}
      POSTGRES_DB: ${POSTGRES_DB:-banking_data_platform}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount thư mục DDL để tự động chạy các script SQL khởi tạo khi container khởi động lần đầu
      - ./warehouse/ddl:/docker-entrypoint-initdb.d
    command: postgres -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4
    networks:
      - banking_network

  kafka:
    image: bitnami/kafka:latest
    container_name: banking_kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093
      - KAFKA_KRAFT_CLUSTER_ID=banking_kafka_cluster_id
      - KAFKA_CFG_NODE_ID=1
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    networks:
      - banking_network

  debezium:
    image: quay.io/debezium/connect:2.4
    container_name: banking_debezium
    ports:
      - "8083:8083"
    environment:
      - BOOTSTRAP_SERVERS=banking_kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=debezium_configs
      - OFFSET_STORAGE_TOPIC=debezium_offsets
      - STATUS_STORAGE_TOPIC=debezium_statuses
    depends_on:
      - kafka
      - postgres
    networks:
      - banking_network

  spark-master:
    image: bitnami/spark:3.5
    container_name: banking_spark_master
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - banking_network

  spark-worker:
    image: bitnami/spark:3.5
    container_name: banking_spark_worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
    networks:
      - banking_network

  minio:
    image: minio/minio:latest
    container_name: banking_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - banking_network

  airflow:
    image: apache/airflow:2.7.0
    container_name: banking_airflow
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _AIRFLOW_DB_UPGRADE=True
      - _AIRFLOW_WWW_USER_CREATE=True
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    ports:
      - "8081:8080"
    command: standalone
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./batch:/opt/airflow/batch
    networks:
      - banking_network

  prometheus:
    image: prom/prometheus:latest
    container_name: banking_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
    networks:
      - banking_network

  grafana:
    image: grafana/grafana:latest
    container_name: banking_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - banking_network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: banking_clickhouse
    ports:
      - "8123:8123"
      - "9002:9000"
    environment:
      - CLICKHOUSE_DB=banking_warehouse
      - CLICKHOUSE_USER=banking_user
      - CLICKHOUSE_PASSWORD=banking_password
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - banking_network

  redis:
    image: redis:latest
    container_name: banking_redis
    ports:
      - "6379:6379"
    networks:
      - banking_network

  neo4j:
    image: neo4j:5.11
    container_name: banking_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/banking_password
    volumes:
      - neo4j_data:/data
    networks:
      - banking_network

  superset:
    image: apache/superset:latest
    container_name: banking_superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=banking_secret_key_12345678901234567890
    user: "root"
    command: >
      /bin/sh -c "
      pip install clickhouse-sqlalchemy psycopg2-binary &&
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname User --email admin@superset.com --password admin &&
      superset init &&
      /usr/bin/run-server.sh
      "
    networks:
      - banking_network

volumes:
  postgres_data:
  minio_data:
  clickhouse_data:
  neo4j_data:

networks:
  banking_network:
    driver: bridge
