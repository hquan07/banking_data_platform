global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kafka'
    static_configs:
      - targets: ['banking_kafka:9092']

  - job_name: 'postgres'
    static_configs:
      - targets: ['banking_postgres:5432']
