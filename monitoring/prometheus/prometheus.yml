global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kafka'
    static_configs:
      - targets: ['banking_kafka_exporter:9308']

  - job_name: 'fastapi_backend'
    static_configs:
      - targets: ['banking_dashboard_backend:8000']
